name: Readout
options:
  bundleIdPrefix: com.daughhetee
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ReadoutKit:
    path: ReadoutKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Readout:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ReadoutKit
        product: ReadoutSystem
      - package: ReadoutKit
        product: ReadoutCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Readout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Jeremy Daughhetee. MIT License."
        SUFeedURL: https://github.com/jeremywho/readout/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daughhetee.Readout
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SPARKLE_PUBLIC_ED_KEY: UXlAI0CxCkFRsUDiosC03FhrWpZG9yOytFi2Hj8ekdw=
    scheme: {}
