name: Readout
options:
  bundleIdPrefix: com.daughhetee
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ReadoutKit:
    path: ReadoutKit
targets:
  Readout:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: ReadoutKit
        product: ReadoutSystem
      - package: ReadoutKit
        product: ReadoutCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Readout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Jeremy Daughhetee. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daughhetee.Readout
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme: {}
