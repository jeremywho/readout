name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, e.g. 1.2.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate version
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Release must run on main"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be X.Y.Z"; exit 1; }
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "v$VERSION already exists"; exit 1; fi
          latest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "$VERSION is not greater than $latest"; exit 1
          fi
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: scripts/ci.sh
      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci-import-certificate.sh
      - name: Write notarization and Sparkle keys
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-ed-key"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle-ed-key" >> "$GITHUB_ENV"
      - run: scripts/build-release.sh "$VERSION" "$BUILD"
      - name: Notarize and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/package.sh "$VERSION"
      - run: scripts/verify.sh "$VERSION"
      - run: scripts/appcast.sh "$VERSION" "$BUILD"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/Readout-$VERSION.dmg" "dist/Readout-$VERSION.zip" dist/appcast.xml \
            --target "$GITHUB_SHA" --title "Readout $VERSION" --generate-notes
      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle-ed-key" "$RUNNER_TEMP/release.keychain-db"
